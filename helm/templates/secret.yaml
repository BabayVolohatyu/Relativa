apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relativa.fullname" . }}-secret
  labels:
    {{- include "relativa.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secret.jwtSecretKey is required" .Values.secret.jwtSecretKey | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
