apiVersion: v1
kind: Service
metadata:
  name: {{ include "relativa.fullname" . }}-postgres
  labels:
    {{- include "relativa.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "relativa.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
