{{- if .Values.postgres.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relativa.fullname" . }}-postgres-data
  labels:
    {{- include "relativa.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgres.pvc.accessMode }}
  {{- if .Values.postgres.pvc.storageClassName }}
  storageClassName: {{ .Values.postgres.pvc.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.pvc.size }}
{{- end }}
