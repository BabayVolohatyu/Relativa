name: Lab 8 design metrics

on:
  push:
    branches: [lab8]
  workflow_dispatch:

jobs:
  scan:
    name: Design audit metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lizard
        run: pip install lizard==1.24.3

      - name: Test design audit
        run: dotnet test Graph/tests/Relativa.Graph.Integration.Tests/Relativa.Graph.Integration.Tests.csproj --filter FullyQualifiedName~DesignAudit

      - name: Scan CK metrics
        run: dotnet run --project lab8/metrics/Relativa.Lab8.Metrics.csproj -- --repo . --out lab8/out --snapshot inherit-pass

      - uses: actions/upload-artifact@v4
        with:
          name: ck-mood-report
          path: lab8/out/
          retention-days: 14
