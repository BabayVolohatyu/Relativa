apiVersion: apps/v1
kind: Deployment
metadata:
  name: relativa-gateway
  namespace: relativa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relativa-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: relativa-gateway
    spec:
      containers:
        - name: gateway
          image: relativa-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Relativa__AppName
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: APP_NAME
            - name: Relativa__LogLevel
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: LOG_LEVEL
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: JWT_AUDIENCE
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: relativa-secret
                  key: JWT_SECRET
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
