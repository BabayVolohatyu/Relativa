# Lab 3 (extra) - HAProxy with ACTIVE health checks in front of the same three Graph instances.
#
# Why it exists: community nginx can only do PASSIVE health checks (it learns that a node is bad only by failing real
# client requests) and never calls GET /health. HAProxy polls GET /health on every server every 2 s by itself:
#   "inter 2s fall 2 rise 2" -> 2 failed checks (about 4 s) take a node out of the pool, 2 good checks put it back.
# A node that hangs (alive process, no answers) or answers /health with 503 is removed BEFORE clients are sent to it.
#
# Host ports (docker-compose.lab3-haproxy.yml): 8091 = traffic, 8404 = stats page (http://localhost:8404/stats).
# nginx (8090) keeps running next to it, so both balancers can be compared on the same instances.

global
    log stdout format raw local0
    maxconn 4096

resolvers docker
    # Docker's embedded DNS: HAProxy re-resolves the server names, so a restarted container that got a
    # new IP is found again (nginx community resolves names only once, at start / reload).
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s

defaults
    mode http
    log global
    option httplog
    option redispatch
    retries 3
    retry-on conn-failure empty-response junk-response 502 503 504
    timeout connect 2s
    timeout client  60s
    timeout server  60s
    timeout check   2s

frontend graph_in
    bind *:80
    # Liveness of the balancer itself (answered by HAProxy, never forwarded).
    acl is_lb_status path /lb-status
    http-request return status 200 content-type text/plain string "graph-lb-haproxy ok\n" if is_lb_status
    default_backend graph_pool

backend graph_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server graph-1 graph:8083
    server graph-2 graph-2:8083
    server graph-3 graph-3:8083

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
