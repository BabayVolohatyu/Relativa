# Lab 2 - round-robin load balancer in front of the two Graph instances.
#
# Deliberately NO sticky sessions (no ip_hash, no "sticky" cookie, no hash directive):
# the lab requires that ANY instance can answer ANY request. If this file ever gains
# an affinity directive, the stateless claim is no longer proven by the demo.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream graph_backend {
    # Default algorithm = round-robin.
    # max_fails/fail_timeout let nginx skip an instance that was killed (docker stop/kill)
    # instead of sending it every second request.
    server graph:8083   max_fails=1 fail_timeout=5s;
    server graph-2:8083 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    # Idempotent requests that fail on one instance are transparently retried on the other.
    # (POST/PUT are NOT retried by default - nginx only retries non-idempotent methods with
    # the explicit "non_idempotent" flag, which we do not set.)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://graph_backend;
        proxy_http_version 1.1;

        # SignalR / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Instance-ID is produced by the Graph app itself and is passed through untouched.
    }
}
