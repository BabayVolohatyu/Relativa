# Lab 3 - ROUND ROBIN load balancer in front of THREE Graph instances.
#
# Single entry point: clients talk only to this nginx (host port 8090). The Graph instances
# publish host ports for debugging (8083/8085/8086) in the lab stack, but the "encapsulated"
# deployment is: only graph-lb is reachable from outside, instances live on the private network.
#
# Algorithm  : round robin (nginx default, no directive). Every request goes to the next server in turn.
# Health     : PASSIVE health checks (community nginx has no active "health_check" directive, that is nginx Plus).
#              max_fails=2 fail_timeout=10s -> after 2 failed attempts within 10 s the server is excluded
#              for 10 s, then nginx tries it again (automatic recovery).
# Fault      : proxy_next_upstream retries an idempotent request on another instance, so the client
#              does not see a 5xx when one instance dies.
#
# Deliberately NO sticky sessions (no ip_hash / hash / sticky): any instance can answer any request (Lab 2).
# The sibling file graph-lb-lab3-lc.conf is identical except for "least_conn;".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upstream_addr lists every server that was tried (a comma-separated list means a retry happened).
log_format lab3 '$remote_addr [$time_local] "$request" $status '
                'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';

upstream graph_backend {
    # Shared-memory zone: all nginx worker processes share ONE view of the pool (round-robin position,
    # failure counters). Without it every worker rotates on its own, and a sequence of requests that lands on
    # different workers keeps hitting the first server (measured: 6 requests in a row all went to graph-1).
    zone graph_backend 64k;

    # ROUND ROBIN: no balancing directive.
    server graph:8083   max_fails=2 fail_timeout=10s;
    server graph-2:8083 max_fails=2 fail_timeout=10s;
    server graph-3:8083 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    access_log /dev/stdout lab3;

    # Idempotent requests that fail on one instance are transparently retried on another one.
    # POST/PUT are NOT retried (nginx needs the explicit "non_idempotent" flag for that).
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    # Liveness of the balancer itself (answered by nginx, never forwarded).
    location = /lb-status {
        default_type text/plain;
        return 200 "graph-lb ok\n";
    }

    location / {
        proxy_pass http://graph_backend;
        proxy_http_version 1.1;

        # SignalR / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Instance-ID is produced by the Graph app itself and is passed through untouched.
    }
}
