# Lab 3 - LEAST CONNECTIONS load balancer in front of THREE Graph instances.
#
# Identical to graph-lb-lab3-rr.conf except for the single "least_conn;" line in the upstream block.
#
# Algorithm  : least_conn. A new request goes to the server with the fewest ACTIVE connections
#              (ties are broken round-robin). A slow instance keeps its connections open longer, so it
#              accumulates more of them and therefore receives fewer new requests.
#              Best for requests of uneven duration or nodes of uneven speed; no benefit when all
#              requests cost the same and all nodes are equal (then it behaves like round robin).
# Health     : passive (max_fails / fail_timeout), same as the round-robin file.
#
# Deliberately NO sticky sessions (no ip_hash / hash / sticky): any instance can answer any request (Lab 2).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upstream_addr lists every server that was tried (a comma-separated list means a retry happened).
log_format lab3 '$remote_addr [$time_local] "$request" $status '
                'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';

upstream graph_backend {
    # Shared-memory zone: all nginx workers share one connection counter per server. Without it every worker
    # counts only its own connections, and "least connections" is computed on partial information.
    zone graph_backend 64k;

    least_conn;
    server graph:8083   max_fails=2 fail_timeout=10s;
    server graph-2:8083 max_fails=2 fail_timeout=10s;
    server graph-3:8083 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    access_log /dev/stdout lab3;

    # Idempotent requests that fail on one instance are transparently retried on another one.
    # POST/PUT are NOT retried (nginx needs the explicit "non_idempotent" flag for that).
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    # Liveness of the balancer itself (answered by nginx, never forwarded).
    location = /lb-status {
        default_type text/plain;
        return 200 "graph-lb ok\n";
    }

    location / {
        proxy_pass http://graph_backend;
        proxy_http_version 1.1;

        # SignalR / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Instance-ID is produced by the Graph app itself and is passed through untouched.
    }
}
