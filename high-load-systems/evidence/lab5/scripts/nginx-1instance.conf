# Lab 5 scaling experiment: the SAME nginx as the Lab 3 load balancer (same proxy settings, same keep-alive behaviour),
# but with ONE upstream server (graph-1). Run as an extra container on the compose network (no host port needed, the
# k6 container reaches it as http://relativa-lab5-lb-1):
#   docker run -d --name relativa-lab5-lb-1 --network relativa_relativa_net `
#       -v "${PWD}/high-load-systems/evidence/lab5/scripts/nginx-1instance.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
# Remove it afterwards: docker rm -f relativa-lab5-lb-1
# Why not just call graph-1 on port 8083: the extra proxy hop would then be present only in the "3 instances" side
# and would be a second difference between the two sides of the comparison.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream graph_backend {
    zone graph_backend 64k;
    server graph:8083 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    access_log off;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://graph_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
