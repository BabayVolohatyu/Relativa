openapi: 3.0.3
info:
  description: |
    Публічний контракт шлюзу Relativa на порту 8080. Довідка MkDocs рендериться з цього файлу. Версія 1.0.0 фіксує три маршрути, які є в коді гілки testing/lab11.
  title: Relativa Gateway
  version: 1.0.0
servers:
- description: Локальний процес Gateway
  url: http://localhost:8080
paths:
  /health:
    get:
      description: |
        Анонімний маршрут процесу Gateway. Тіло збігається з анонімним об'єктом у Program.cs. Метод не проксується в інші сервіси.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
                service: relativa-gateway
              schema:
                $ref: "#/components/schemas/Health"
          description: Процес шлюзу відповідає.
        "502":
          content:
            application/json:
              example:
                status: 502
                title: Bad Gateway
                detail: An error occurred while processing your request.
              schema:
                $ref: "#/components/schemas/Error"
          description: Необроблений виняток шлюзу. Пише GlobalExceptionHandler.
      summary: Стан процесу шлюзу
  /api/v1/operator/digest:
    get:
      description: |
        Анонімний маршрут OperatorDigestEndpoints. Чисел угод у тілі немає. Маршрут додано в краш-тесті ЛР10 і лишився в коді після відновлення документації.
      operationId: getOperatorDigest
      responses:
        "200":
          content:
            application/json:
              example:
                kind: operator-digest
                audience: sales-operator
                includes:
                - openDeals
                - highRiskDeals
                - pendingInvitations
              schema:
                $ref: "#/components/schemas/OperatorDigest"
          description: Перелік полів зрізу.
        "502":
          content:
            application/json:
              example:
                status: 502
                title: Bad Gateway
                detail: An error occurred while processing your request.
              schema:
                $ref: "#/components/schemas/Error"
          description: Необроблений виняток шлюзу. Пише GlobalExceptionHandler.
      summary: Поля операторського зрізу
  /auth/api/v1/auth/login:
    post:
      description: |
        Публічний шлях шлюзу. YARP знімає префікс /auth, Authentication приймає POST /api/v1/auth/login. Тіло 200 — LoginResponseDto. 400 і 401 пише GlobalExceptionHandler сервісу Authentication з полів status, title, detail.
      operationId: login
      requestBody:
        content:
          application/json:
            example:
              email: admin@relativa.com
              password: secret
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                accessToken: header.payload.signature
                expiresAt: 2026-11-23T20:00:00Z
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: Токен видано.
        "400":
          content:
            application/json:
              example:
                status: 400
                title: Validation Failed
                detail: Email is required.
              schema:
                $ref: "#/components/schemas/Error"
          description: FluentValidation відхилив тіло. Title Validation Failed.
        "401":
          content:
            application/json:
              example:
                status: 401
                title: Unauthorized
                detail: Invalid email or password.
              schema:
                $ref: "#/components/schemas/Error"
          description: AuthException invalid_credentials.
        "502":
          description: |
            Кластер Authentication не відповідає. Живий шлюз без цього процесу повертає 502 і порожнє тіло (Content-Length 0). YARP завершує відповідь сам, тож JSON GlobalExceptionHandler тут не пишеться.
      summary: Вхід і видача JWT
components:
  schemas:
    Health:
      example:
        status: ok
        service: relativa-gateway
      properties:
        status:
          enum:
          - ok
          type: string
        service:
          enum:
          - relativa-gateway
          type: string
      required:
      - service
      - status
      type: object
    OperatorDigest:
      example:
        kind: operator-digest
        audience: sales-operator
        includes:
        - openDeals
        - highRiskDeals
        - pendingInvitations
      properties:
        kind:
          enum:
          - operator-digest
          type: string
        audience:
          enum:
          - sales-operator
          type: string
        includes:
          items:
            enum:
            - openDeals
            - highRiskDeals
            - pendingInvitations
            type: string
          type: array
      required:
      - audience
      - includes
      - kind
      type: object
    LoginRequest:
      example:
        email: admin@relativa.com
        password: secret
      properties:
        email:
          format: email
          type: string
        password:
          type: string
        twoFactorCode:
          nullable: true
          type: string
      required:
      - email
      - password
      type: object
    LoginResponse:
      example:
        accessToken: header.payload.signature
        expiresAt: 2026-11-23T20:00:00Z
      properties:
        accessToken:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
      - accessToken
      - expiresAt
      type: object
    Error:
      example:
        status: 401
        title: Unauthorized
        detail: Invalid email or password.
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
      required:
      - detail
      - status
      - title
      type: object

