# Source: relativa/templates/pre-upgrade-check.yaml
# Hook: before every "helm upgrade" the database must answer. If this Pod fails,
# Helm aborts the upgrade and the running revision stays untouched.
apiVersion: v1
kind: Pod
metadata:
  name: relativa-pre-upgrade-check
  labels:
    helm.sh/chart: relativa-1.0.0
    app.kubernetes.io/name: relativa
    app.kubernetes.io/instance: relativa
    app.kubernetes.io/component: hook
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: pg-isready
      image: "postgres:16-alpine"
      imagePullPolicy: IfNotPresent
      command:
        - pg_isready
        - -h
        - relativa-postgres
        - -p
        - "5432"
        - -U
        - "relativa"
        - -d
        - "relativa"
---
# Source: relativa/templates/tests/test-health.yaml
apiVersion: v1
kind: Pod
metadata:
  name: relativa-test-health
  labels:
    helm.sh/chart: relativa-1.0.0
    app.kubernetes.io/name: relativa
    app.kubernetes.io/instance: relativa
    app.kubernetes.io/component: test
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
    # Hook Pods are not owned by the release, so they would survive "helm uninstall".
    # Deleting them on success keeps the namespace clean.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: "postgres:16-alpine"
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e
          body="$(wget -qO- -T 10 http://relativa-gateway:8080/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
