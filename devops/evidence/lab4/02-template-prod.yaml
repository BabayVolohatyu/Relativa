---
# Source: relativa/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relativa-postgres
  labels:
    helm.sh/chart: relativa-1.0.0
    app.kubernetes.io/name: relativa
    app.kubernetes.io/instance: relativa
    app.kubernetes.io/component: postgres
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relativa
      app.kubernetes.io/instance: relativa
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relativa
        app.kubernetes.io/instance: relativa
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relativa-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "relativa", "-d", "relativa"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "relativa", "-d", "relativa"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 750m
              memory: 768Mi
            requests:
              cpu: 150m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relativa-postgres-data
